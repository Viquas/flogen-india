<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fff; }
    #root { min-height: 100vh; }
    .error-container { 
      padding: 20px; 
      background: #fef2f2; 
      color: #dc2626; 
      font-family: monospace;
      white-space: pre-wrap;
      border: 1px solid #fee2e2;
      margin: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    // Global error handler for the iframe
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("Iframe runtime error:", message, error);
      const rootEl = document.getElementById('root');
      if (rootEl && !rootEl.innerHTML) {
         rootEl.innerHTML = '<div class="error-container"><b>Runtime Error:</b><br/>' + message + '</div>';
      }
    };

    // Helper to create simple icons
    const createIcon = (name) => (props) => React.createElement('svg', {
      className: 'w-5 h-5 ' + (props?.className || ''),
      fill: 'none',
      stroke: 'currentColor',
      viewBox: '0 0 24 24',
      strokeWidth: 2,
      strokeLinecap: 'round',
      strokeLinejoin: 'round',
      ...props
    }, React.createElement('rect', { width: 18, height: 18, x: 3, y: 3, rx: 2 }),
       React.createElement('path', { d: 'M12 8v8M8 12h8' }),
       React.createElement('title', null, name)
    );

    // Proxy to catch any icon name the AI might invent/use
    const IconProxy = new Proxy({}, {
      get: (target, prop) => {
        if (typeof prop === 'string') {
          return createIcon(prop);
        }
        return target[prop];
      }
    });

    // Mock shadcn components
    const Button = ({ children, className = '', variant = 'default', size = 'default', ...props }) => {
      const baseStyles = 'inline-flex items-center justify-center rounded-md font-medium transition-colors focus-visible:outline-none disabled:opacity-50 cursor-pointer';
      const variants = {
        default: 'bg-zinc-900 text-white hover:bg-zinc-800',
        outline: 'border border-zinc-200 bg-white hover:bg-zinc-100',
        secondary: 'bg-zinc-100 text-zinc-900 hover:bg-zinc-200',
        ghost: 'hover:bg-zinc-100',
        link: 'text-zinc-900 underline-offset-4 hover:underline',
        destructive: 'bg-red-500 text-white hover:bg-red-600',
      };
      const sizes = {
        default: 'h-10 px-4 py-2',
        sm: 'h-9 px-3',
        lg: 'h-11 px-8',
        icon: 'h-10 w-10',
      };
      return React.createElement('button', {
        className: `${baseStyles} ${variants[variant] || variants.default} ${sizes[size] || sizes.default} ${className}`,
        ...props
      }, children);
    };

    const Card = ({ children, className = '', ...props }) => 
      React.createElement('div', { className: `rounded-lg border bg-white shadow-sm ${className}`, ...props }, children);
    const CardHeader = ({ children, className = '', ...props }) => 
      React.createElement('div', { className: `flex flex-col space-y-1.5 p-6 ${className}`, ...props }, children);
    const CardTitle = ({ children, className = '', ...props }) => 
      React.createElement('h3', { className: `text-2xl font-semibold ${className}`, ...props }, children);
    const CardDescription = ({ children, className = '', ...props }) => 
      React.createElement('p', { className: `text-sm text-zinc-500 ${className}`, ...props }, children);
    const CardContent = ({ children, className = '', ...props }) => 
      React.createElement('div', { className: `p-6 pt-0 ${className}`, ...props }, children);
    const CardFooter = ({ children, className = '', ...props }) => 
      React.createElement('div', { className: `flex items-center p-6 pt-0 ${className}`, ...props }, children);

    const Badge = ({ children, className = '', variant = 'default', ...props }) => {
      const variants = {
          default: 'bg-zinc-900 text-white',
          secondary: 'bg-zinc-100 text-zinc-900',
          outline: 'border border-zinc-200',
          destructive: 'bg-red-500 text-white',
      };
      return React.createElement('div', {
          className: `inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ${variants[variant] || variants.default} ${className}`,
          ...props
      }, children);
    };

    const Input = ({ className = '', ...props }) =>
      React.createElement('input', {
        className: `flex h-10 w-full rounded-md border border-zinc-200 bg-white px-3 py-2 text-sm placeholder:text-zinc-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-400 ${className}`,
        ...props
      });

    const Textarea = ({ className = '', ...props }) =>
      React.createElement('textarea', {
        className: `flex min-h-[80px] w-full rounded-md border border-zinc-200 bg-white px-3 py-2 text-sm placeholder:text-zinc-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-400 ${className}`,
        ...props
      });

    const Separator = ({ className = '', orientation = 'horizontal', ...props }) =>
      React.createElement('div', {
        className: `shrink-0 bg-zinc-200 ${orientation === 'horizontal' ? 'h-[1px] w-full' : 'h-full w-[1px]'} ${className}`,
        ...props
      });

    // Tabs components
    const TabsContext = React.createContext({});
    const Tabs = ({ children, defaultValue, className = '', ...props }) => {
      const [value, setValue] = React.useState(defaultValue);
      return React.createElement(TabsContext.Provider, { value: { value, setValue } },
        React.createElement('div', { className: `${className}`, ...props }, children)
      );
    };
    const TabsList = ({ children, className = '', ...props }) =>
      React.createElement('div', { 
        className: `inline-flex h-10 items-center justify-center rounded-md bg-zinc-100 p-1 ${className}`, 
        ...props 
      }, children);
    const TabsTrigger = ({ children, value, className = '', ...props }) => {
      const ctx = React.useContext(TabsContext);
      return React.createElement('button', {
        className: `inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium transition-all ${ctx.value === value ? 'bg-white shadow-sm' : ''} ${className}`,
        onClick: () => ctx.setValue(value),
        ...props
      }, children);
    };
    const TabsContent = ({ children, value, className = '', ...props }) => {
      const ctx = React.useContext(TabsContext);
      if (ctx.value !== value) return null;
      return React.createElement('div', { className: `mt-2 ${className}`, ...props }, children);
    };

    // Provide icon proxy for lucide-react
    const Lucide = IconProxy;
    // Common individual exports the AI might use - expanded list
    const { Mail, Phone, MapPin, Globe, Check, ChevronRight, ArrowRight, Star, Users, Zap, Shield, Clock, Code, Database, Cloud, Settings, Heart, Sparkles, Menu, X, ChevronDown, ChevronUp, ChevronLeft, Search, Home, User, Calendar, FileText, Image, Video, Music, Download, Upload, Edit, Trash, Plus, Minus, ExternalLink, Link, Copy, Share, Send, MessageCircle, Bell, Award, Target, TrendingUp, BarChart, PieChart, Activity, Cpu, Server, Wifi, Lock, Unlock, Key, Eye, EyeOff, Sun, Moon, Laptop, Smartphone, Tablet, Monitor, Printer, Camera, Mic, Volume2, Play, Pause, SkipForward, SkipBack, RefreshCw, RotateCw, Move, Maximize, Minimize, Layers, Grid, List, Filter, SortAsc, SortDesc, Bookmark, Flag, Tag, Folder, File, Archive, Package, Box, Gift, ShoppingCart, CreditCard, DollarSign, Percent, Hash, AtSign, Paperclip, Scissors, Clipboard, CheckCircle, XCircle, AlertCircle, Info, HelpCircle, AlertTriangle, ThumbsUp, ThumbsDown, Smile, Frown, Meh, Coffee, Briefcase, Building, MapPinned, Navigation, Compass, Anchor, Umbrella, Thermometer, Droplet, Wind, Snowflake, Flame, Leaf, Tree, Mountain, Sunrise, Sunset, CloudRain, CloudSnow, CloudLightning, Rainbow, Rocket, Plane, Car, Train, Bus, Bike, Ship, Truck, Footprints, Baby, Dog, Cat, Bird, Fish, Bug, Skull, Ghost, Alien, Bot, Wand2, Sparkle, Crown, Medal, Trophy, Gem, Diamond } = IconProxy;

    try {
      // The generated component code
      function GeneratedPage() {
  return (
    <div className="min-h-screen bg-gradient-to-b from-gray-50 to-gray-200 text-gray-900">
      {/* Hero Section */}
      <section className="flex flex-col items-center justify-center h-screen p-8 bg-gradient-to-r from-blue-600 via-blue-500 to-blue-700">
        <h1 className="text-6xl font-extrabold text-white mb-4">Welcome to TechVentures Inc</h1>
        <p className="text-xl text-gray-200 mb-8">Leading the way in AI and Digital Transformation</p>
        <Button variant="default" className="text-blue-600 bg-white hover:bg-gray-100 transition">Get Started</Button>
      </section>

      {/* Services/Features Section */}
      <section className="py-16 px-8 bg-white text-center">
        <h2 className="text-4xl font-bold mb-12">Our Services</h2>
        <div className="grid gap-8 md:grid-cols-2 lg:grid-cols-4">
          {[
            {
              title: "AI Consulting",
              description: "Innovative AI solutions tailored to your needs."
            },
            {
              title: "Cloud Migration",
              description: "Seamlessly transition to the cloud with ease."
            },
            {
              title: "Custom Software Development",
              description: "Build software solutions that drive success."
            },
            {
              title: "Data Analytics",
              description: "Unlock insights with cutting-edge analytics."
            }
          ].map((service, index) => (
            <Card key={index} className="hover:shadow-lg transition">
              <CardHeader>
                <CardTitle>{service.title}</CardTitle>
              </CardHeader>
              <CardContent>
                <CardDescription>{service.description}</CardDescription>
              </CardContent>
            </Card>
          ))}
        </div>
      </section>

      {/* About Section */}
      <section className="py-16 px-8 bg-gray-100 text-center">
        <h2 className="text-4xl font-bold mb-12">About TechVentures</h2>
        <p className="text-lg max-w-3xl mx-auto">
          TechVentures Inc is a pioneering technology consulting firm specializing in AI and digital transformation. Our team of experts is dedicated to helping businesses harness the power of technology to drive innovation and success.
        </p>
      </section>

      {/* Contact Section */}
      <section className="py-16 px-8 bg-white text-center">
        <h2 className="text-4xl font-bold mb-12">Get in Touch</h2>
        <form className="max-w-lg mx-auto">
          <div className="mb-6">
            <Input type="email" placeholder="Enter your email" className="w-full" />
          </div>
          <div className="mb-6">
            <Textarea placeholder="Your message" className="w-full" />
          </div>
          <Button variant="default" className="w-full">Send Message</Button>
        </form>
      </section>

      {/* Footer */}
      <footer className="py-8 bg-gray-800 text-gray-300">
        <div className="flex justify-evenly items-center">
          <div className="flex items-center">
            <Mail className="mr-2" />
            <span>hello@techventures.com</span>
          </div>
          <div className="flex items-center">
            <Phone className="mr-2" />
            <span>+1-555-TECH</span>
          </div>
          <div className="flex items-center">
            <Globe className="mr-2" />
            <a href="https://techventures.com" className="hover:text-gray-100 transition">techventures.com</a>
          </div>
        </div>
        <p className="text-center mt-6">&copy; {new Date().getFullYear()} TechVentures Inc. All rights reserved.</p>
      </footer>
    </div>
  )
}

      // Render the component
      const target = typeof GeneratedPage !== 'undefined' ? GeneratedPage : (typeof App !== 'undefined' ? App : null);
      
      if (target) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(target));
      } else {
        document.getElementById('root').innerHTML = '<div class="error-container"><b>Error:</b> No mountable component found. Make sure your code defines a "GeneratedPage" component.</div>';
      }
    } catch (err) {
      console.error('Mount Error:', err);
      document.getElementById('root').innerHTML = '<div class="error-container"><b>Mount Error:</b><br/>' + err.message + '</div>';
    }
  </script>
</body>
</html>
