name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        # TODO: remove || true once lint warnings are cleaned up
        run: npx eslint --max-warnings 0 || true

      - name: Type Check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Test Coverage
        run: npx vitest run --coverage
        continue-on-error: true

      - name: Build
        run: npm run build
